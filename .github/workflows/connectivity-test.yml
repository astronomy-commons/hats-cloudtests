# This workflow will run daily on weekdays at 05:45.
# It will install Python dependencies and connect to a set of external data sets.

name: Nightly connectivity cloudtests

on:

  # Runs this workflow automatically
  schedule:
    - cron: 45 5 * * 1-5
    
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python '3.14'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.14'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
    - name: Install dependencies
      run: |
        sudo apt-get update
        uv pip install --system -e .[dev]
        if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi
    - name: List dependencies
      run: |
        pip list
    - name: Run connectivity tests
      run: |
        echo "Public IPv4: $(curl -4 -s --max-time 10 https://api.ipify.org || echo unavailable)"
        echo "Public IPv6: $(curl -6 -s --max-time 10 https://api6.ipify.org || echo unavailable)"
        python -m pytest connectivity_tests -s

  notify:

    needs: build
    if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
    - name: Send status to Slack app (LSDB CI Reporter)
      id: slack
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        # For posting a rich message using Block Kit
        payload: |
          {
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":${{ needs.build.result }}: *${{ github.repository }}:* nightly connectivity (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run #${{ github.run_number }}>)"
                }
              }
            ]
          }

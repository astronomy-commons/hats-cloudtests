# This workflow will install Python dependencies, run tests with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # Issue #154
        # cloud: ['local_s3', 'anon_s3', 'local_gcs', 'http']
        cloud: ['local_s3', 'anon_s3', 'http']
        include:
          - python-version: '3.14'
            cloud: 'connectivity'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
    - name: Install dependencies
      run: |
        sudo apt-get update
        uv pip install --system -e .[dev]
        if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi
    - name: Run local s3 with pytest
      if: matrix.cloud == 'local_s3'
      run: |
        python -m pytest -o log_cli=true -vv tests --cloud local_s3
    - name: Run local http with pytest
      if: matrix.cloud == 'http'
      run: |
        python -m pytest -o log_cli=true -vv tests --cloud http
    - name: Setup GCS emulator
      if: matrix.cloud == 'local_gcs'
      uses: fsouza/fake-gcs-action@main
      with:
        version: "1.37.2"
        data: tests/cloud
        public-host: "0.0.0.0:4443"
        external-url: "http://localhost:4443"
        scheme: http
    - name: Run local GCS (google cloud) with pytest
      if: matrix.cloud == 'local_gcs'
      run: |
        python -m pytest -o log_cli=true -vv tests --cloud local_gcs
    # - name: Run ABFS unit tests with pytest
    #   run: |
    #     python -m pytest tests --cloud abfs
    #   env:
    #     ABFS_LINCCDATA_ACCOUNT_NAME: ${{ secrets.LINCC_ABFS_ACCOUNT_NAME }}
    #     ABFS_LINCCDATA_ACCOUNT_KEY: ${{ secrets.LINCC_ABFS_ACCOUNT_KEY }}
    - name: Run connectivity tests
      if: matrix.cloud == 'connectivity'
      run: |
        echo "Public IPv4: $(curl -4 -s --max-time 10 https://api.ipify.org || echo unavailable)"
        echo "Public IPv6: $(curl -6 -s --max-time 10 https://api6.ipify.org || echo unavailable)"
        python -m pytest -o log_cli=true -vv connectivity_tests -s
